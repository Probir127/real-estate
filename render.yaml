services:
  # ── Django Backend Service ─────────────────────────────
  - type: web
    name: realestate-backend
    env: python
    buildCommand: "./backend/build.sh"
    startCommand: "cd backend && gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: realestate-frontend
          property: url
      - key: ADMIN_SETUP_EMAIL
        value: admin@zennor.com
      - key: ADMIN_SETUP_TOKEN
        sync: false
      - key: ADMIN_SETUP_PASSWORD
        sync: false
      - key: SSLCOMMERZ_STORE_ID
        sync: false
      - key: SSLCOMMERZ_STORE_PASSWORD
        sync: false
      - key: SSLCOMMERZ_IS_SANDBOX
        sync: false
      - key: SSLCOMMERZ_SUCCESS_URL
        value: https://realestate-rcdq.onrender.com/api/payments/success/
      - key: SSLCOMMERZ_FAIL_URL
        value: https://realestate-rcdq.onrender.com/api/payments/fail/
      - key: SSLCOMMERZ_CANCEL_URL
        value: https://realestate-rcdq.onrender.com/api/payments/cancel/
      - key: SSLCOMMERZ_IPN_URL
        value: https://realestate-rcdq.onrender.com/api/payments/ipn/
      - key: FRONTEND_APP_URL
        fromService:
          type: web
          name: realestate-frontend
          property: url
      - key: DATABASE_URL
        fromDatabase:
          name: realestate-db
          property: connectionString

  # ── React Frontend Static Site ─────────────────────────
  - type: web
    name: realestate-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /property/*
        destination: /index.html
      - type: rewrite
        source: /properties/*
        destination: /index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: realestate-backend
          property: url

databases:
  # ── PostgreSQL Database ────────────────────────────────
  - name: realestate-db
    databaseName: realestate_db
    user: postgres
    plan: free
